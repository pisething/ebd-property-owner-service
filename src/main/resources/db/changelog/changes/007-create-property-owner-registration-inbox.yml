databaseChangeLog:
  - changeSet:
      id: 007-create-property-owner-registration-inbox
      author: pisethjavaschool
      changes:
        - createTable:
            tableName: property_owner_registration_inbox
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: source_event_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: processed_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false