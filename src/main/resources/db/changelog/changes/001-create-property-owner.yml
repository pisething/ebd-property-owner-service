databaseChangeLog:
  - changeSet:
      id: 001-create-property-owner
      author: pisethjavaschool
      changes:
        - createTable:
            tableName: property_owner
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: owner_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: business_name
                  type: VARCHAR(150)
              - column:
                  name: business_registration_number
                  type: VARCHAR(80)
              - column:
                  name: tax_number
                  type: VARCHAR(80)
              - column:
                  name: phone_number
                  type: VARCHAR(30)
              - column:
                  name: email
                  type: VARCHAR(150)
              - column:
                  name: telegram
                  type: VARCHAR(100)
              - column:
                  name: verification_status
                  type: VARCHAR(50)
                  defaultValue: DRAFT
                  constraints:
                    nullable: false
              - column:
                  name: verified_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: verified_by
                  type: UUID
              - column:
                  name: rejection_reason
                  type: VARCHAR(1000)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_by
                  type: UUID
        - addUniqueConstraint:
            tableName: property_owner
            columnNames: user_id
            constraintName: uk_property_owner_user_id
        - createIndex:
            tableName: property_owner
            indexName: idx_property_owner_status_active
            columns:
              - column:
                  name: verification_status
              - column:
                  name: active
        - createIndex:
            tableName: property_owner
            indexName: idx_property_owner_owner_type
            columns:
              - column:
                  name: owner_type
