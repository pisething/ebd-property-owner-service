databaseChangeLog:
  - changeSet:
      id: 003-create-owner-document
      author: pisethjavaschool
      changes:
        - createTable:
            tableName: owner_document
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: document_type_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: document_number
                  type: VARCHAR(100)
              - column:
                  name: media_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: PENDING_REVIEW
                  constraints:
                    nullable: false
              - column:
                  name: rejection_reason
                  type: VARCHAR(1000)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: UUID
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: updated_by
                  type: UUID
        - addForeignKeyConstraint:
            baseTableName: owner_document
            baseColumnNames: owner_id
            referencedTableName: property_owner
            referencedColumnNames: id
            constraintName: fk_owner_document_owner
        - addForeignKeyConstraint:
            baseTableName: owner_document
            baseColumnNames: document_type_code
            referencedTableName: owner_document_type
            referencedColumnNames: code
            constraintName: fk_owner_document_type
        - createIndex:
            tableName: owner_document
            indexName: idx_owner_document_owner_id
            columns:
              - column:
                  name: owner_id
